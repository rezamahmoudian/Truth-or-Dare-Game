user app app;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query strings can contain legacy WebSocket tokens; never log them.
    log_format safe '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
    access_log /dev/stdout safe;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $original_scheme { default $scheme; https https; }
    server {
        listen 3000;
        server_name _;
        root /srv/frontend;
        client_max_body_size 30m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy 'camera=(), microphone=(self), geolocation=()' always;

        location ~ ^/(api|admin|ws)(/|$) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $original_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
        }
        location = /.well-known/assetlinks.json { try_files $uri =404; }
        location ~ /\. { return 404; }
        # Attachments must pass Django's access checks, never a static alias.
        location /private_media/ { return 404; }
        location /media/ { return 404; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
